<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0e1014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="tradingbot" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Dashboard · tradingbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Web font loads non-blocking (media=print swap); the CSS falls back to a system font stack until it arrives, or forever if it never does. -->
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#view-root">Skip to content</a>
  <div id="app">
    <header class="topnav">
      <div class="topnav-left">
        <a class="brand" href="#dashboard">tradingbot</a>
        <nav class="nav-links" id="main-nav" aria-label="Main">
          <a href="#dashboard" data-nav="dashboard" class="active" aria-current="page" aria-label="Dashboard"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v10H3zM13 3h8v6h-8zM13 11h8v10h-8zM3 15h8v6H3z"/></svg><span class="nav-full">DASHBOARD</span><span class="nav-short" aria-hidden="true">Dash</span><span class="nav-badge" id="nav-badge" aria-hidden="true" hidden></span></a>
          <a href="#performance" data-nav="performance" aria-label="Performance"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-9M15 6h6v6"/></svg><span class="nav-full">PERFORMANCE</span><span class="nav-short" aria-hidden="true">Perf</span></a>
          <a href="#market" data-nav="market" aria-label="Market"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16M6 8h0M6 7v9M12 3v18M18 6v13M4 9h4v6H4zM10 6h4v9h-4zM16 9h4v7h-4z"/></svg><span class="nav-full">MARKET</span><span class="nav-short" aria-hidden="true">Market</span></a>
          <a href="#logs" data-nav="logs" aria-label="Logs"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="nav-full">LOGS</span><span class="nav-short" aria-hidden="true">Logs</span></a>
          <a href="#settings" data-nav="settings" aria-label="Settings"><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span class="nav-full">SETTINGS</span><span class="nav-short" aria-hidden="true">Settings</span></a>
        </nav>
      </div>
      <div class="topnav-status">
        <span class="worker-status" id="worker-status-m" role="status">
          <span class="dot" id="worker-dot-m" aria-hidden="true"></span>
          <span id="worker-label-m">worker</span>
        </span>
        <button class="menu-btn" id="btn-menu" type="button" aria-expanded="false" aria-controls="topnav-right" aria-label="Menu: worker controls and account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <div class="menu-scrim" id="menu-scrim" hidden></div>
      <div class="topnav-right" id="topnav-right">
        <div class="sheet-grip" aria-hidden="true"></div>
        <span class="badge badge-paper" id="mode-badge" title="Simulated positions only — no orders are ever sent">PAPER · PREDICT</span>
        <span class="worker-status" id="worker-status">
          <span class="dot" id="worker-dot" aria-hidden="true"></span>
          <span id="worker-label">worker</span>
        </span>
        <a class="budget-chip" id="budget-chip" href="#settings/budget" data-level="ok" hidden><span class="bc-i" id="budget-chip-i" aria-hidden="true">✓</span><span id="budget-chip-t">AI budget</span></a>
        <button class="btn btn-start" id="btn-start" type="button" hidden>START</button>
        <button class="btn btn-stop" id="btn-stop" type="button">STOP</button>
        <button class="btn btn-kill" id="btn-kill" type="button">KILL</button>
        <span class="acct-email" id="acct-email" hidden></span>
        <button class="signout" id="btn-signout" type="button" hidden>Sign out</button>
        <button class="signout" id="btn-auth" type="button" hidden>Sign in</button>
      </div>
    </header>

    <div id="mood-bar" class="mood-wrap" aria-label="Market mood"></div>

    <main id="view-root" tabindex="-1"></main>
  </div>

  <noscript><p style="padding:16px">This dashboard needs JavaScript.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
