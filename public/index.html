<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tradingbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="app">
    <header class="topnav">
      <div class="topnav-left">
        <a class="brand" href="#dashboard" data-nav="dashboard">tradingbot</a>
        <nav class="nav-links" id="main-nav">
          <a href="#dashboard" data-nav="dashboard" class="active">DASHBOARD</a>
          <a href="#market" data-nav="market">MARKET</a>
          <a href="#ai-desk" data-nav="ai-desk">AI DESK</a>
          <a href="#strategies" data-nav="strategies">STRATEGIES</a>
          <a href="#activity" data-nav="activity">ACTIVITY</a>
          <a href="#chat" data-nav="chat">CHAT</a>
          <a href="#decisions" data-nav="decisions">DECISIONS</a>
          <a href="#logs" data-nav="logs">LOGS</a>
          <a href="#settings" data-nav="settings">SETTINGS</a>
        </nav>
      </div>
      <div class="topnav-right">
        <span class="badge badge-paper" id="mode-badge">PREDICT</span>
        <span class="worker-status" id="worker-status">
          <span class="dot" id="worker-dot"></span>
          worker
        </span>
        <button class="btn btn-stop" id="btn-stop" type="button">STOP</button>
        <button class="btn btn-kill" id="btn-kill" type="button">KILL</button>
        <div class="avatar-row">
          <button class="icon-btn" title="Theme" type="button" aria-label="Theme">◐</button>
          <button class="icon-btn accent" title="Status" type="button" aria-label="Status">●</button>
          <button class="icon-btn" title="Account" type="button" aria-label="Account">◎</button>
        </div>
        <button class="signout" type="button">Sign out</button>
      </div>
    </header>

    <main id="view-root"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
