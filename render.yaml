services:
  - type: web
    name: tradingbot-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app: required so rate limiting keys on the real client IP.
      - key: TRUST_PROXY
        value: "true"
      - key: USE_MOCK_DATA
        value: "true"
      - key: SCAN_INTERVAL_MINUTES
        value: "30"
      - key: WATCHLIST_SIZE
        value: "12"
      - key: PREDICTION_HORIZON_HOURS
        value: "24"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      # Secrets: set these in the Render dashboard (never commit values).
      # ADMIN_TOKEN protects the credit-spending / mutating endpoints (/api/run, close, settings, worker). SET IT.
      - key: ADMIN_TOKEN
        sync: false
      # Live Alpaca data: set both keys, then set USE_MOCK_DATA=false.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
