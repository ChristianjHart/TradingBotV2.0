services:
  - type: web
    name: tradingbot-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app: REQUIRED so rate limiting / login throttling key on the real client IP
      # (without it every visitor shares one bucket, so a spray from anywhere throttles everyone).
      - key: TRUST_PROXY
        value: "true"
      - key: USE_MOCK_DATA
        value: "true"
      - key: SCAN_INTERVAL_MINUTES
        value: "30"
      - key: WATCHLIST_SIZE
        value: "12"
      - key: PREDICTION_HORIZON_HOURS
        value: "24"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      # Signs session cookies and encrypts the account's stored API keys. Generated once by Render; do NOT change it
      # later (stored keys would become unreadable and would have to be re-entered).
      - key: APP_SECRET
        generateValue: true
      # Secrets: set these in the Render dashboard (never commit values).
      # SIGNUP_CODE: REQUIRED. Until an account exists the API answers 503 setup_required (fail closed), and the owner account can only be
      # created with this code (open the site after deploy, sign up with it). Use a long random secret. SET IT BEFORE FIRST OPEN.
      - key: SIGNUP_CODE
        sync: false
      # ADMIN_TOKEN (optional): Bearer token for scripts; also accepted as the signup code when SIGNUP_CODE is unset.
      - key: ADMIN_TOKEN
        sync: false
      # Live Alpaca data: set both keys, then set USE_MOCK_DATA=false.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # SUPABASE_*: STRONGLY RECOMMENDED. The free-plan disk is ephemeral: without Supabase every restart/redeploy forgets the owner
      # account, stored API keys and logged-out sessions (the app then fails closed to setup mode and you must sign up again).
      # Run supabase/migrations/001..004 in the Supabase SQL editor.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
