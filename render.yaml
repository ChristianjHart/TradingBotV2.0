services:
  - type: web
    name: tradingbot-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render terminates TLS in front of the app: required so rate limiting keys on the real client IP.
      - key: TRUST_PROXY
        value: "true"
      - key: USE_MOCK_DATA
        value: "true"
      - key: SCAN_INTERVAL_MINUTES
        value: "30"
      - key: WATCHLIST_SIZE
        value: "12"
      - key: PREDICTION_HORIZON_HOURS
        value: "24"
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_DATA_URL
        value: https://data.alpaca.markets
      # Signs session cookies and encrypts the account's stored API keys. Generated once by Render; do NOT change it
      # later (stored keys would become unreadable and would have to be re-entered).
      - key: APP_SECRET
        generateValue: true
      # Secrets: set these in the Render dashboard (never commit values).
      # SIGNUP_CODE: required to create the owner account (open the site after deploy, sign up with this code). SET IT.
      - key: SIGNUP_CODE
        sync: false
      # ADMIN_TOKEN (optional): Bearer token for scripts; also accepted as the signup code when SIGNUP_CODE is unset.
      - key: ADMIN_TOKEN
        sync: false
      # Live Alpaca data: set both keys, then set USE_MOCK_DATA=false.
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
